name: Desktop native builds
on:
  push:
    paths: ['desktop/**', 'tests/proxy-cases.json', '.github/workflows/desktop.yml']
  pull_request:
    paths: ['desktop/**', 'tests/proxy-cases.json', '.github/workflows/desktop.yml']
  workflow_dispatch:
    inputs:
      publish_release:
        description: 'Publish the package version as a GitHub Release (main only)'
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: desktop-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            platform: linux
            arch: x64
            appDir: linux-unpacked
            audioPackage: libasound2
          - runner: ubuntu-24.04-arm
            platform: linux
            arch: arm64
            appDir: linux-arm64-unpacked
            audioPackage: libasound2t64
          - runner: windows-2022
            platform: win
            arch: x64
            appDir: win-unpacked
          - runner: windows-11-arm
            platform: win
            arch: arm64
            appDir: win-arm64-unpacked
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    defaults:
      run:
        working-directory: desktop
        shell: bash
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          architecture: ${{ matrix.arch }}
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - name: Linux build and display dependencies
        if: matrix.platform == 'linux'
        run: sudo apt-get update && sudo apt-get install -y build-essential python3 rpm xvfb libgtk-3-0 libnss3 libgbm1 ${{ matrix.audioPackage }}
      - name: Install locked dependencies
        run: npm ci
      - name: Test services against stock Node before Electron rebuild
        timeout-minutes: 3
        run: npm test
      - name: Build renderer and rebuild native PTY for Electron
        run: npm run build && npx electron-builder install-app-deps --arch=${{ matrix.arch }}
      - name: Linux real PTY and Electron smoke
        if: matrix.platform == 'linux'
        run: xvfb-run -a npm run test:e2e
      - name: Windows real ConPTY and Electron smoke
        if: matrix.platform == 'win'
        run: npm run test:e2e
      - name: Package matching native architecture
        run: npm run dist:${{ matrix.platform }} -- --${{ matrix.arch }}
      - name: Linux packaged application regression tests
        if: matrix.platform == 'linux'
        env:
          TERMINAL_TEST_EXECUTABLE: ${{ github.workspace }}/desktop/dist/${{ matrix.appDir }}/terminal
        run: xvfb-run -a npm run test:e2e
      - name: Windows packaged application regression tests
        if: matrix.platform == 'win'
        env:
          TERMINAL_TEST_EXECUTABLE: ${{ github.workspace }}/desktop/dist/${{ matrix.appDir }}/terminal.exe
        run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        with:
          name: terminal-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            desktop/dist/*.AppImage
            desktop/dist/*.deb
            desktop/dist/*.rpm
            desktop/dist/*.exe
            desktop/dist/*.zip
          if-no-files-found: error

  release:
    needs: desktop
    if: >-
      github.ref == 'refs/heads/main' &&
      ((github.event_name == 'workflow_dispatch' && inputs.publish_release) ||
       (github.event_name == 'push' && contains(github.event.head_commit.message, '[release]')))
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: terminal-*
          path: release-assets
          merge-multiple: true
      - name: Validate all installers and create checksums
        shell: bash
        run: |
          set -euo pipefail
          version=$(node -p "require('./desktop/package.json').version")
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          cd release-assets
          for file in "terminal-${version}-linux-x86_64.AppImage" "terminal-${version}-linux-amd64.deb" "terminal-${version}-linux-x86_64.rpm" "terminal-${version}-linux-arm64.AppImage" "terminal-${version}-linux-arm64.deb" "terminal-${version}-linux-aarch64.rpm"; do
            test -s "$file"
          done
          for arch in x64 arm64; do
            test -s "terminal-${version}-windows-${arch}-setup.exe"
            test -s "terminal-${version}-windows-${arch}.zip"
          done
          sha256sum terminal-* > SHA256SUMS
          sha256sum -c SHA256SUMS
      - name: Upload installers and publish release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          version=$(node -p "require('./desktop/package.json').version")
          tag="v${version}"
          existing_tag=$(gh api "repos/${GH_REPO}/git/matching-refs/tags/${tag}" --jq ".[] | select(.ref == \"refs/tags/${tag}\") | .ref")
          if [[ -n "$existing_tag" ]]; then
            tag_sha=$(gh api "repos/${GH_REPO}/commits/${tag}" --jq .sha)
            [[ "$tag_sha" == "$GITHUB_SHA" ]] || { echo 'Release tag points to different source' >&2; exit 1; }
          fi
          cat > release-notes.md <<'NOTES'
          Windows / Linux 独立终端，包含标签页、外观设置、壁纸及真实本地 shell。

          - 支持单独按 Esc 依次取消弹窗、菜单与搜索栏，再关闭当前标签页；最后一个标签页关闭时退出窗口。
          - 忙碌会话保留关闭确认；长按 Esc 或确认等待期间重复按键不会连续关闭标签页。当前 Esc 也会拦截 Vim 等终端程序的同名按键。
          - 修复界面测试启动竞态：输入前等待真实 shell 就绪，避免 Linux ARM64 等平台在提示符初始化前输入导致测试失败。
          - 四个平台均完成服务测试、界面测试和打包后回归测试。

          下载与系统架构一致的文件：Windows 使用 setup.exe 或 zip；Debian / Ubuntu 使用 deb；Fedora / openSUSE 使用 rpm；其他 Linux 桌面可使用 AppImage。
          安装步骤见仓库 README。安装包无需 Node.js 或 Python。Windows 安装包未签名；macOS 暂无安装包。
          SHA256SUMS 提供安装包校验值。
          NOTES
          printf '\n源码提交：%s\n构建记录：https://github.com/%s/actions/runs/%s\n' "$GITHUB_SHA" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" >> release-notes.md
          if gh release view "$tag" --json isDraft,targetCommitish > existing-release.json 2>/dev/null; then
            node -e "const r=require('./existing-release.json'); if (!r.isDraft || r.targetCommitish !== process.env.GITHUB_SHA) throw Error('Refusing to replace an existing release');"
          else
            gh release create "$tag" --target "$GITHUB_SHA" --draft --title "terminal ${version}" --notes-file release-notes.md
          fi
          gh release upload "$tag" release-assets/* --clobber
          gh release edit "$tag" --draft=false --latest
