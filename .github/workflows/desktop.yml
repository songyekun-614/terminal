name: Desktop native builds
on:
  push:
    branches: [main, release/v0.3.0]
    paths: ['desktop/**', 'tests/proxy-cases.json', '.github/workflows/desktop.yml']
  pull_request:
    paths: ['desktop/**', 'tests/proxy-cases.json', '.github/workflows/desktop.yml']
  workflow_dispatch:
    inputs:
      publish_release:
        description: 'Publish the package version as a GitHub Release (main only)'
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: desktop-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/release/v0.3.0' }}
jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            platform: linux
            arch: x64
            appDir: linux-unpacked
            audioPackage: libasound2
          - runner: ubuntu-24.04-arm
            platform: linux
            arch: arm64
            appDir: linux-arm64-unpacked
            audioPackage: libasound2t64
          - runner: windows-2022
            platform: win
            arch: x64
            appDir: win-unpacked
          - runner: windows-11-arm
            platform: win
            arch: arm64
            appDir: win-arm64-unpacked
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    defaults:
      run:
        working-directory: desktop
        shell: bash
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          architecture: ${{ matrix.arch }}
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - name: Linux build and display dependencies
        if: matrix.platform == 'linux'
        run: sudo apt-get update && sudo apt-get install -y build-essential python3 rpm xvfb libgtk-3-0 libnss3 libgbm1 ${{ matrix.audioPackage }}
      - name: Install locked dependencies
        run: npm ci
      - name: Test services against stock Node before Electron rebuild
        timeout-minutes: 3
        run: npm test
      - name: Build renderer and rebuild native PTY for Electron
        run: npm run build && npx electron-builder install-app-deps --arch=${{ matrix.arch }}
      - name: Linux real PTY and Electron smoke
        if: matrix.platform == 'linux'
        run: xvfb-run -a npm run test:e2e
      - name: Windows real ConPTY and Electron smoke
        if: matrix.platform == 'win'
        run: npm run test:e2e
      - name: Package matching native architecture
        run: npm run dist:${{ matrix.platform }} -- --${{ matrix.arch }}
      - name: Linux packaged application regression tests
        if: matrix.platform == 'linux'
        env:
          TERMINAL_TEST_EXECUTABLE: ${{ github.workspace }}/desktop/dist/${{ matrix.appDir }}/terminal
        run: xvfb-run -a npm run test:e2e
      - name: Windows packaged application regression tests
        if: matrix.platform == 'win'
        env:
          TERMINAL_TEST_EXECUTABLE: ${{ github.workspace }}/desktop/dist/${{ matrix.appDir }}/terminal.exe
        run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        with:
          name: terminal-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            desktop/dist/*.AppImage
            desktop/dist/*.deb
            desktop/dist/*.rpm
            desktop/dist/*.exe
            desktop/dist/*.zip
          if-no-files-found: error

  release:
    needs: desktop
    if: >-
      github.ref == 'refs/heads/release/v0.3.0' &&
      github.event_name == 'push' &&
      contains(github.event.head_commit.message, '[republish-v0.3.0]')
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          pattern: terminal-*
          path: release-assets
          merge-multiple: true
      - name: Validate all installers and create checksums
        shell: bash
        run: |
          set -euo pipefail
          version=$(node -p "require('./desktop/package.json').version")
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          cd release-assets
          for file in "terminal-${version}-linux-x86_64.AppImage" "terminal-${version}-linux-amd64.deb" "terminal-${version}-linux-x86_64.rpm" "terminal-${version}-linux-arm64.AppImage" "terminal-${version}-linux-arm64.deb" "terminal-${version}-linux-aarch64.rpm"; do
            test -s "$file"
          done
          for arch in x64 arm64; do
            test -s "terminal-${version}-windows-${arch}-setup.exe"
            test -s "terminal-${version}-windows-${arch}.zip"
          done
          sha256sum terminal-* > SHA256SUMS
          sha256sum -c SHA256SUMS
      - name: Republish verified terminal 0.3.0 installers
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          EXPECTED_PREVIOUS_TAG: 3ea7b43a9eaab5cccc986169f535e84c5366a926
        run: |
          set -euo pipefail
          version=$(node -p "require('./desktop/package.json').version")
          [[ "$version" == '0.3.0' && "$GITHUB_REF" == 'refs/heads/release/v0.3.0' ]]
          tag="v${version}"
          tag_sha=$(gh api "repos/${GH_REPO}/commits/${tag}" --jq .sha)
          [[ "$tag_sha" == "$EXPECTED_PREVIOUS_TAG" || "$tag_sha" == "$GITHUB_SHA" ]] || { echo 'Release tag changed unexpectedly' >&2; exit 1; }
          git merge-base --is-ancestor "$tag_sha" "$GITHUB_SHA"
          cp docs/releases/0.3.0.md release-notes.md
          printf '\n源码提交：%s\n构建记录：https://github.com/%s/actions/runs/%s\n' "$GITHUB_SHA" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" >> release-notes.md
          # All four builds, packaged regressions and local checksums passed.
          # Hide the release while replacing assets so a mixed set is not offered.
          release_id=$(gh api "repos/${GH_REPO}/releases/tags/${tag}" --jq .id)
          gh release edit "$tag" --draft=true
          gh release upload "$tag" release-assets/* --clobber
          gh api "repos/${GH_REPO}/releases/${release_id}" > uploaded-release.json
          node <<'VERIFY'
          const fs = require('node:fs'), crypto = require('node:crypto');
          const sums = fs.readFileSync('release-assets/SHA256SUMS', 'utf8');
          const expected = new Map(sums.trim().split('\n').map(line => {
            const match = /^([a-f0-9]{64})  (.+)$/.exec(line);
            if (!match) throw Error('Invalid checksum line');
            return [match[2], 'sha256:' + match[1]];
          }));
          if (expected.size !== 10) throw Error('Expected ten installers');
          expected.set('SHA256SUMS', 'sha256:' + crypto.createHash('sha256').update(sums).digest('hex'));
          const assets = JSON.parse(fs.readFileSync('uploaded-release.json')).assets;
          if (assets.length !== expected.size) throw Error('Unexpected release asset count');
          for (const asset of assets) {
            if (!expected.has(asset.name) || asset.size <= 0 || asset.state !== 'uploaded' || asset.digest !== expected.get(asset.name))
              throw Error('Uploaded asset verification failed: ' + asset.name);
          }
          VERIFY
          current_tag_sha=$(gh api "repos/${GH_REPO}/commits/${tag}" --jq .sha)
          [[ "$current_tag_sha" == "$tag_sha" ]] || { echo 'Release tag changed during upload' >&2; exit 1; }
          gh api --method PATCH "repos/${GH_REPO}/git/refs/tags/${tag}" -f sha="$GITHUB_SHA" -F force=false
          gh release edit "$tag" --target "$GITHUB_SHA" --title 'terminal 0.3.0' --notes-file release-notes.md --draft=false --latest=false
